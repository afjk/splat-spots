name = "splat-spots-api"
main = "src/index.ts"
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]

# Created with:  npx wrangler d1 create splat-spots
# The id identifies the database; it is not a secret.
[[d1_databases]]
binding = "DB"
database_name = "splat-spots"
database_id = "9824b21d-8e22-40dd-b510-ad2178c2e98f"

[vars]
# Extra origins allowed to call the API, comma separated. The production
# origin (https://afjk.github.io) is always allowed.
ALLOWED_ORIGINS = "http://localhost:4321"

# Secrets, not vars — neither value belongs in this file:
#   npx wrangler secret put SUBMISSION_KEY   # required; intake rejects everything without it
#   npx wrangler secret put QUEUE_TOKEN
