name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deploy at a time; let an in-flight run finish rather than cancelling
# it, so a half-published site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Thumbnails are never committed, so every deploy derives them. The cache
      # keeps that cheap; `npm run thumbs` prunes anything whose capture has
      # left the catalog, so a restored cache can never resurrect a removed
      # capture. Failures degrade to a placeholder tile rather than blocking.
      - name: Key the thumbnail cache on the capture list
        id: catalog
        run: |
          key=$(ls data/captures/*.json 2>/dev/null | xargs -r -n1 basename \
                | sort | shasum -a 256 | cut -d' ' -f1)
          echo "key=${key:-empty}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: public/thumbs
          key: thumbs-${{ steps.catalog.outputs.key }}
          restore-keys: thumbs-

      - name: Render thumbnails
        run: npm run thumbs
        continue-on-error: true

      - run: npm test

      # The forms post to the Worker. Set this repository variable to the
      # deployed API origin; without it the forms say so instead of failing.
      - run: npm run build
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
